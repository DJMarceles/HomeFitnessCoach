<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VormCoach | Lokale praktijktest</title>
    <style>
      body {
        font: 16px system-ui;
        max-width: 52rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      label,
      button {
        display: block;
        margin: 1rem 0;
      }
      input,
      select,
      button {
        font: inherit;
      }
      video {
        width: 100%;
        max-height: 32vh;
        background: #222;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Lokale praktijktest</h1>
    <label>Setcode (zonder naam) <input id="code" required pattern="[A-Za-z0-9_-]+" maxlength="60" /></label>
    <label
      >Oefening
      <select id="exercise">
        <option>squat</option>
        <option>reverse-lunge</option>
        <option>pushup</option>
        <option>glute-bridge</option>
        <option>plank</option>
      </select></label
    >
    <label>Lokale testopname <input id="clip" type="file" accept="video/*" /></label>
    <label
      >SDK
      <select id="sdk">
        <option>0.10.35</option>
        <option>1.2.3</option>
      </select></label
    >
    <label
      >Model
      <select id="model">
        <option>Full</option>
        <option>Lite</option>
      </select></label
    >
    <button id="run">Vergelijk op dezelfde beelden</button><video muted playsinline></video>
    <p id="status" role="status"></p>
    <pre id="result"></pre>
    <a id="save" hidden>Download meetrapport</a>
    <script type="module" src="./replay.js"></script>
  </body>
</html>
